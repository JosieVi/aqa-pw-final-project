name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Кнопка для ручного запуска в интерфейсе GitHub

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Установка Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 2. Авторизация в GitHub Packages (чтобы скачать твои приватные образы)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Создание .env файла из секрета GitHub
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 4. Запуск приложения через Docker Compose
      - name: Start Application
        run: docker compose up -d

      # 5. Ожидание готовности фронтенда (замени порт, если он другой)
      - name: Wait for App
        run: |
          npm install -g wait-on
          wait-on http://localhost:8585 --timeout 60000

      # 6. Установка зависимостей тестов и браузеров
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 7. Прогон тестов
      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Передаем URL фронтенда в тесты (берем из .env или хардкодим)
          BASE_URL: http://localhost:8585

      # 8. Сохранение отчета (доступен во вкладке Actions после прогона)
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 1. Генерируем Allure-отчет, подтягивая историю из ветки gh-pages
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # 2. Публикуем сгенерированный отчет на GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # 9. Уведомление в Slack
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        if: always() # Запускать даже если тесты упали
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: qa-alerts # Имя твоего канала
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_ICON: https://playwright.dev/img/playwright-logo.svg
          SLACK_TITLE: 'Playwright Test Results'
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Status:* ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}
            *Commit:* ${{ github.event.head_commit.message }}

            📊 *<https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/|Allure Report (Metrics & History)>*

            📦 *<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions Run & Download Artifacts>*
